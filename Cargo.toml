[workspace]
resolver = "3"
members = [
    "apps/cli",
    "apps/engine",
    ".config",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
config = { path = ".config" }
engine = { path = "apps/engine" }

anyhow = "1.0"
async-trait = "0.1"
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
indexmap = { version = "2.5", features = ["serde"] }
once_cell = "1.20"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
