[workspace]
resolver = "3"
members = [
    "apps/cli",
    "apps/engine",
    ".config",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["maulanasdqn"]
repository = "https://github.com/maulanasdqn/cosmium"
readme = "README.md"
homepage = "https://github.com/maulanasdqn/cosmium"
keywords = ["chromium", "stealth", "fingerprint", "browser", "scraping"]
categories = ["command-line-utilities", "web-programming"]

[workspace.dependencies]
config = { path = ".config", package = "cosmium-config", version = "0.2.0" }
engine = { path = "apps/engine", package = "cosmium-engine", version = "0.2.0" }

anyhow = "1.0"
async-trait = "0.1"
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5.0"
dotenvy = "0.15"
indexmap = { version = "2.5", features = ["serde"] }
once_cell = "1.20"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
base64 = "0.22"
chromiumoxide = "0.9"
futures-util = "0.3"
rand = "0.9"
tower-http = { version = "0.6", features = ["cors", "fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unused_qualifications = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

multiple_crate_versions = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
suboptimal_flops = "allow"
redundant_pub_crate = "allow"

allow_attributes = "deny"
allow_attributes_without_reason = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
empty_structs_with_brackets = "deny"
exit = "deny"
expect_used = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
indexing_slicing = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
panic = "deny"
panic_in_result_fn = "deny"
print_stderr = "deny"
print_stdout = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
self_named_module_files = "deny"
str_to_string = "deny"
string_slice = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"
wildcard_enum_match_arm = "deny"
