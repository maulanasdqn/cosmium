name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  loc-limit:
    name: per-file LOC cap (200)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: scan
        run: |
          set -euo pipefail
          oversize=$(find apps -name '*.rs' -exec wc -l {} + \
            | awk '$1 > 200 && $2 != "total" { printf "  %s (%d)\n", $2, $1 }')
          if [ -n "$oversize" ]; then
            echo "Files exceed 200 LOC:"
            echo "$oversize"
            exit 1
          fi

  no-new-comments:
    name: no new comments
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scan diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          offenders=$(git diff --unified=0 "${base}...HEAD" -- apps \
            | awk '
              /^\+\+\+ / { f = $2; sub(/^b\//, "", f); next }
              /^\+/ {
                line = $0; gsub(/:\/\//, "SCHEME", line)
                if (f ~ /\.rs$/ && line ~ /\/\//) {
                  orig = $0; sub(/^\+/, "", orig); print f ": " orig
                }
              }')
          if [ -n "$offenders" ]; then
            echo "New comments are not allowed (existing comments are grandfathered):"
            echo "$offenders"
            exit 1
          fi
