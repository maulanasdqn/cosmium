name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  loc-limit:
    name: per-file LOC cap (200)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: scan
        run: |
          set -euo pipefail
          oversize=$(find apps -name '*.rs' -exec wc -l {} + \
            | awk '$1 > 200 && $2 != "total" { printf "  %s (%d)\n", $2, $1 }')
          if [ -n "$oversize" ]; then
            echo "Files exceed 200 LOC:"
            echo "$oversize"
            exit 1
          fi

  no-comments:
    name: no comments
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: scan
        run: |
          set -euo pipefail
          cat > /tmp/no-comments.awk <<'AWK'
          FNR == 1 { block = 0 }
          {
            line = $0
            gsub(/"([^"\\]|\\.)*"/, "\"\"", line)
            if (FILENAME !~ /\.rs$/) gsub(/'([^'\\]|\\.)*'/, "''", line)
            gsub(/[A-Za-z]+:\/\//, "", line)
            gsub(/\*\/\*/, "", line)
            if (line ~ /^[[:space:]]*\/\/ @ts-check[[:space:]]*$/) next
            if (block || line ~ /\/\// || line ~ /\/\*/) {
              print FILENAME ":" FNR ": " $0
              block = (line ~ /\/\*/ && line !~ /\*\//) || (block && line !~ /\*\//)
            }
          }
          AWK
          offenders=$(git ls-files -- '*.rs' '*.ts' '*.tsx' '*.js' '*.mjs' '*.css' \
            | grep -v '^patches/' | xargs -r awk -f /tmp/no-comments.awk)
          if [ -n "$offenders" ]; then
            echo "Comments are not allowed:"
            echo "$offenders"
            exit 1
          fi
